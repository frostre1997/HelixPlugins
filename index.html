<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Helix Plugins</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧬</text></svg>" />
</head>
<body>

    <header>
        <div class="container">
            <div class="logo">
                <!-- Helix logo SVG -->
                <svg class="logo-icon" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                    <path d="M2 17l10 5 10-5"/>
                    <path d="M2 12l10 5 10-5"/>
                </svg>
                <h1>Helix <span>Plugins</span></h1>
            </div>
            <p class="tagline">Extend your browser with custom features</p>
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Search plugins..." />
                <button id="searchBtn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"/>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <section class="stats container">
        <div class="stat-item">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2">
                <rect x="2" y="7" width="20" height="14" rx="2" ry="2"/>
                <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>
            </svg>
            <span class="stat-number" id="pluginCount">0</span>
            <span class="stat-label">Plugins</span>
        </div>
        <div class="stat-item">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                <polyline points="7 10 12 15 17 10"/>
                <line x1="12" y1="15" x2="12" y2="3"/>
            </svg>
            <span class="stat-number" id="downloadCount">0</span>
            <span class="stat-label">Downloads</span>
        </div>
        <div class="stat-item">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2">
                <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
            </svg>
            <span class="stat-number"></span>
            <span class="stat-label">Fast & Light</span>
        </div>
    </section>

    <main class="container">
        <div class="plugin-grid" id="pluginGrid">
            <div class="loading">Loading plugins...</div>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" style="vertical-align:middle;">
                    <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
                </svg>
                &nbsp;Made for <strong>Helix Browser</strong>
            </p>
            <div class="footer-links">
                <a href="#" onclick="alert('Submit your plugin via GitHub!')">Submit</a>
                <a href="#" onclick="alert('Docs coming soon')">Docs</a>
                <a href="#" onclick="alert('Join our community')">Community</a>
            </div>
            <p class="footer-copy">&copy; 2026 Helix Browser</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
    </html>
